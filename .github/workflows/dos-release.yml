# Builds the MS-DOS version (msdos/, DJGPP + SDL3) and publishes it.
#
#   push a tag v*        -> a release with that name, WARPNES-DOS-<tag>.zip attached
#   push to main         -> the rolling "dos-latest" pre-release is replaced
#   Actions > Run workflow -> same as a push to main
name: DOS release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DJGPP_URL: https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache DJGPP
        id: djgpp-cache
        uses: actions/cache@v4
        with:
          path: ~/djgpp
          key: djgpp-linux64-gcc1220

      - name: Download DJGPP
        if: steps.djgpp-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "$DJGPP_URL" -o /tmp/djgpp.tar.bz2
          tar xjf /tmp/djgpp.tar.bz2 -C ~

      - name: Install build dependencies
        # DJGPP's binutils (ar) need libfl
        run: sudo apt-get update -q && sudo apt-get install -y -q libfl2 zip

      - name: Build
        working-directory: msdos
        run: |
          export PATH="$HOME/djgpp/bin:$PATH"
          make DOCKER=0 -j"$(nproc)" dist

      - name: Package
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="WARPNES-DOS-${GITHUB_REF_NAME}"
          else
            NAME="WARPNES-DOS-$(git rev-parse --short HEAD)"
          fi
          (cd msdos/build/dist && zip -r -9 "$GITHUB_WORKSPACE/$NAME.zip" WARPNES)
          unzip -l "$NAME.zip"
          echo "zip=$NAME.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: warpnes-dos
          path: ${{ steps.pkg.outputs.zip }}

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" \
            --title "WarpNES $GITHUB_REF_NAME" \
            --notes "MS-DOS build (DJGPP + SDL3, CWSDPMI built in). Unzip and run WARPNES.EXE GAME.NES; see README.TXT." \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --clobber

      - name: Release (dos-latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dos-latest --cleanup-tag -y || true
          gh release create dos-latest "${{ steps.pkg.outputs.zip }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "WarpNES DOS (latest build)" \
            --notes "Built automatically from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. MS-DOS build (DJGPP + SDL3, CWSDPMI built in). Unzip and run WARPNES.EXE GAME.NES; see README.TXT."
